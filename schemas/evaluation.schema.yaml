$schema: https://json-schema.org/draft/2020-12/schema
$id: https://hypothetest.elastic/schemas/evaluation.schema.yaml
title: Hypothetest Evaluation
type: object
additionalProperties: false
required:
  - name
  - hypothesis
  - plan
  - manifest
  - evidence
  - measurements
  - comparisons
  - report
properties:
  name:
    type: string
    minLength: 1
    pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
  evaluation_id:
    type: string
    minLength: 1
  hypothesis:
    $ref: "#/$defs/path"
  plan:
    $ref: "#/$defs/path"
  manifest:
    $ref: "#/$defs/manifest"
  evidence:
    $ref: "#/$defs/evidence"
  measurements:
    $ref: "#/$defs/measurement_set"
  comparisons:
    $ref: "#/$defs/comparison_set"
  report:
    $ref: "#/$defs/report"
  charts:
    type: array
    default: []
    items:
      $ref: "#/$defs/artifact"
  summary:
    $ref: "#/$defs/artifact"

$defs:
  path:
    type: string
    minLength: 1

  manifest:
    type: object
    additionalProperties: false
    required:
      - started_at
      - status
      - blueprint
      - plan
    properties:
      started_at:
        type: string
      completed_at:
        type:
          - string
          - "null"
      runtime:
        $ref: "#/$defs/runtime"
      status:
        enum:
          - complete
          - partial
          - failed
      blueprint:
        $ref: "#/$defs/path"
      plan:
        $ref: "#/$defs/path"
      git_commit:
        type: string
      started_by:
        type: string
      deployment:
        type: object
        additionalProperties: true
      experiment:
        $ref: "#/$defs/experiment"
      variations:
        type: array
        default: []
        items:
          type: string
      repeats:
        type: integer
        minimum: 1
      failures:
        type: array
        default: []
        items:
          type: string
      quality:
        enum:
          - development-grade
          - environment-dependent
          - benchmark-grade
          - incomplete

  runtime:
    type: object
    additionalProperties: false
    required:
      - total_seconds
      - variations
    properties:
      total_seconds:
        type: number
        minimum: 0
      total_human:
        type: string
      variations:
        type: array
        default: []
        items:
          $ref: "#/$defs/variation_runtime"

  variation_runtime:
    type: object
    additionalProperties: false
    required:
      - variation
      - seconds
    properties:
      variation:
        type: string
        minLength: 1
      repeat:
        type: integer
        minimum: 1
      started_at:
        type: string
      completed_at:
        type:
          - string
          - "null"
      seconds:
        type: number
        minimum: 0
      human:
        type: string
      status:
        enum:
          - complete
          - partial
          - failed

  experiment:
    type: object
    additionalProperties: false
    required:
      - intent
      - constants
      - variables
    properties:
      intent:
        type: string
        minLength: 1
        pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
      constants:
        type: object
        additionalProperties: false
        properties:
          required:
            type: array
            default: []
            uniqueItems: true
            items:
              $ref: "#/$defs/factor"
          best_effort:
            type: array
            default: []
            uniqueItems: true
            items:
              $ref: "#/$defs/factor"
      variables:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/factor"

  factor:
    type: string
    minLength: 1
    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$

  evidence:
    type: object
    additionalProperties: false
    properties:
      raw:
        type: array
        default: []
        items:
          $ref: "#/$defs/artifact"
      diagnostics:
        type: array
        default: []
        items:
          $ref: "#/$defs/artifact"
      phase_output:
        type: array
        default: []
        items:
          $ref: "#/$defs/artifact"
      generated:
        type: array
        default: []
        items:
          $ref: "#/$defs/artifact"

  artifact:
    type: object
    additionalProperties: false
    required:
      - path
      - kind
    properties:
      path:
        $ref: "#/$defs/path"
      kind:
        enum:
          - raw
          - diagnostic
          - phase_output
          - measurement
          - comparison
          - chart
          - report
          - summary
          - manifest
          - generated
      format:
        enum:
          - toon
          - markdown
          - json
          - yaml
          - yml
          - zip
          - log
          - txt
          - csv
          - png
          - svg
      source:
        type: string
      checksum:
        type: string
      description:
        type: string

  measurement_set:
    type: object
    additionalProperties: false
    properties:
      normalized:
        type: array
        default: []
        items:
          $ref: "#/$defs/artifact"
      primary:
        type: array
        default: []
        items:
          type: string
      secondary:
        type: array
        default: []
        items:
          type: string

  comparison_set:
    type: object
    additionalProperties: false
    properties:
      artifacts:
        type: array
        default: []
        items:
          $ref: "#/$defs/artifact"
      baseline:
        type: string
      candidates:
        type: array
        default: []
        items:
          type: string
      decision:
        type: string
      confidence:
        enum:
          - low
          - medium
          - high
          - statistical
          - insufficient

  report:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        $ref: "#/$defs/path"
      formats:
        type: array
        minItems: 1
        default:
          - markdown
        items:
          enum:
            - markdown
            - toon
            - charts
      sections:
        type: array
        default: []
        items:
          type: string
      conclusion:
        type: string
