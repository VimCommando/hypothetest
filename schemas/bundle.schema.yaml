$schema: https://json-schema.org/draft/2020-12/schema
$id: https://hypothetest.elastic/schemas/bundle.schema.yaml
title: Hypothetest ScenarioBundle
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    const: hypothetest.elastic/v1
  kind:
    const: ScenarioBundle
  metadata:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
        pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
      owner:
        type: string
      description:
        type: string
      version:
        type: string
  spec:
    type: object
    additionalProperties: false
    required:
      - scenario
      - plan
      - readme
    properties:
      scenario:
        $ref: "#/$defs/file"
      plan:
        $ref: "#/$defs/file"
      readme:
        $ref: "#/$defs/file"
      portability:
        type: object
        additionalProperties: false
        properties:
          self_contained:
            type: boolean
            default: false
          expected_runtime:
            type: string
          prerequisites:
            type: array
            items:
              type: string
      directories:
        type: object
        additionalProperties: false
        properties:
          data:
            $ref: "#/$defs/directory"
          tracks:
            $ref: "#/$defs/directory"
          templates:
            $ref: "#/$defs/directory"
          scripts:
            $ref: "#/$defs/directory"
          diagnostics:
            $ref: "#/$defs/directory"
          generated:
            $ref: "#/$defs/directory"
          runs:
            $ref: "#/$defs/directory"
      fixtures:
        type: array
        default: []
        items:
          $ref: "#/$defs/fixture"
      checksums:
        type: string
        default: checksums.yml
      archive:
        type: object
        additionalProperties: false
        properties:
          format:
            const: zip
          include_runs:
            type: boolean
            default: false
          exclude:
            type: array
            items:
              type: string

$defs:
  file:
    type: string
    minLength: 1

  directory:
    type: string
    minLength: 1

  fixture:
    type: object
    additionalProperties: false
    required:
      - path
      - type
    properties:
      path:
        type: string
        minLength: 1
      type:
        enum:
          - data
          - rally_track
          - elasticsearch_template
          - elasticsearch_payload
          - script
          - esdiag_sources
          - esdiag_collection_plan
          - generated_asset
          - run_artifact
      format:
        enum:
          - ndjson
          - jsonl
          - csv
          - tsv
          - json
          - yaml
          - yml
          - toon
          - zip
          - sh
          - py
          - gz
      required:
        type: boolean
        default: true
      checksum:
        type: string
      description:
        type: string
