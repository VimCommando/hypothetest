$schema: https://json-schema.org/draft/2020-12/schema
$id: https://hypothetest.elastic/schemas/hypothetest.schema.yaml
title: Hypothetest Plan
type: object
additionalProperties: false
required:
  - name
  - question
  - hypothesis
  - experiment
  - deployment
  - dataset
  - variations
  - evaluation
  - measure
  - compare
properties:
  name:
    $ref: "#/$defs/name"
  owner:
    type: string
    minLength: 1
  description:
    type: string
  version:
    type: string
  question:
    type: string
    minLength: 1
  hypothesis:
    $ref: "#/$defs/hypothesis"
  experiment:
    $ref: "#/$defs/experiment"
  deployment:
    $ref: "#/$defs/deployment"
  dataset:
    $ref: "#/$defs/dataset"
  variations:
    type: object
    minProperties: 2
    additionalProperties:
      $ref: "#/$defs/variation"
  evaluation:
    $ref: "#/$defs/evaluation"
  measure:
    $ref: "#/$defs/measure"
  compare:
    $ref: "#/$defs/compare"
  report:
    $ref: "#/$defs/report"

$defs:
  name:
    type: string
    minLength: 1
    pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$

  hypothesis:
    oneOf:
      - type: string
        minLength: 1
      - type: object
        additionalProperties: false
        required:
          - claim
        properties:
          claim:
            type: string
            minLength: 1
          "null":
            type: string
            minLength: 1
          alternative:
            type: string
            minLength: 1
          tail:
            enum:
              - one_tailed
              - two_tailed

  experiment:
    type: object
    additionalProperties: false
    required:
      - intent
      - constants
      - variables
    properties:
      intent:
        type: string
        minLength: 1
        pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
        examples:
          - compare_deployments
          - compare_data_configuration
          - compare_cluster_configuration
          - measure_ingest_throughput
          - validate_configuration_compatibility
      constants:
        type: object
        additionalProperties: false
        properties:
          required:
            type: array
            default: []
            uniqueItems: true
            items:
              $ref: "#/$defs/factor"
          best_effort:
            type: array
            default: []
            uniqueItems: true
            items:
              $ref: "#/$defs/factor"
      variables:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/factor"

  factor:
    type: string
    minLength: 1
    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$

  deployment:
    type: object
    additionalProperties: true
    required:
      - target
    properties:
      target:
        enum:
          - compose
          - existing
          - elastic-cloud
      scope:
        enum:
          - local
          - remote
        default: local
      engine:
        enum:
          - auto
          - docker
          - podman
      remote:
        type: object
        additionalProperties: false
        required:
          - host
        properties:
          host:
            type: string
            minLength: 1
          user:
            type: string
          auth:
            type: object
            additionalProperties: true
          workdir:
            type: string
      elasticsearch:
        type: object
        additionalProperties: true
        properties:
          version:
            type: string
          heap:
            type: string
          memory:
            type: string
          security:
            type: boolean
      services:
        type: object
        additionalProperties: true
      repositories:
        type: object
        additionalProperties: true

  dataset:
    type: object
    additionalProperties: true
    required:
      - loader
    properties:
      loader:
        enum:
          - rally
          - espipe
      input:
        type: string
      target:
        type: string
      track:
        type: string
      challenge:
        type: string
      settings:
        type: object
        additionalProperties: true
      options:
        type: object
        additionalProperties: true

  variation:
    type: object
    additionalProperties: true
    properties:
      description:
        type: string
      config:
        type: object
        additionalProperties: true
      setup:
        type: array
        items:
          $ref: "#/$defs/action"

  action:
    type: object
    additionalProperties: true
    minProperties: 1

  evaluation:
    type: object
    additionalProperties: false
    required:
      - phases
    properties:
      repeats:
        type: integer
        minimum: 1
        default: 3
      order:
        enum:
          - randomized
          - listed
        default: randomized
      setup:
        type: array
        default: []
        items:
          $ref: "#/$defs/action"
      reset:
        $ref: "#/$defs/reset"
      phases:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/phase"

  reset:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1

  phase:
    type: object
    additionalProperties: false
    required:
      - name
      - tool
    properties:
      name:
        type: string
        minLength: 1
      tool:
        enum:
          - rally
          - espipe
          - elasticsearch_api
          - shell
          - python
      with:
        type: object
        additionalProperties: true
        default: {}

  measure:
    type: object
    additionalProperties: false
    required:
      - primary
    properties:
      primary:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/metric"
      secondary:
        type: array
        default: []
        items:
          $ref: "#/$defs/metric"
      diagnostics:
        oneOf:
          - type: boolean
            const: false
          - $ref: "#/$defs/diagnostics"

  metric:
    oneOf:
      - type: string
        minLength: 1
      - type: object
        additionalProperties: false
        required:
          - name
        properties:
          name:
            type: string
            minLength: 1
          source:
            enum:
              - elasticsearch_api
              - espipe
              - rally
              - phase_artifact
              - esdiag
              - shell
              - computed
          unit:
            type: string
            minLength: 1
          api:
            type: string
            minLength: 1
          artifact:
            type: string
            minLength: 1
          field:
            type: string
            minLength: 1
          phase:
            type: string
            minLength: 1
          shape:
            enum:
              - scalar
              - percentile_set
              - histogram
            default: scalar
          measures:
            type: string
            minLength: 1
          validity_note:
            type: string
            minLength: 1

  diagnostics:
    type: object
    additionalProperties: false
    properties:
      tool:
        const: esdiag
        default: esdiag
      results:
        type: object
        additionalProperties: true
      at:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          additionalProperties: false
          required:
            - apis
          properties:
            apis:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
      during:
        $ref: "#/$defs/during"

  during:
    oneOf:
      - type: object
        additionalProperties: false
        properties:
          profile:
            $ref: "#/$defs/observation_profile"
          methods:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: "#/$defs/observation_method"
          interval:
            type: string
            pattern: ^\d+[smh]$
            default: 10s
          packages:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/package"
          phases:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
      - $ref: "#/$defs/observation_profile"

  observation_profile:
    type: string
    enum:
      - none
      - light
      - standard
      - comprehensive

  observation_method:
    type: string
    enum:
      - use
      - tsa
      - off_cpu
      - on_cpu
      - latency
      - drill_down

  package:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        enum:
          - elasticsearch_api
          - sysstat
          - procps
          - jdk_tools
          - perf
          - bcc_tools
          - bpftrace
          - iproute2
          - coreutils
          - darwin_tools
      commands:
        type: array
        items:
          type: string
          minLength: 1
      scripts:
        type: array
        items:
          type: string
          minLength: 1
      apis:
        type: array
        items:
          type: string
          minLength: 1

  compare:
    type: object
    additionalProperties: false
    required:
      - baseline
      - candidates
      - decision
    properties:
      baseline:
        type: string
        minLength: 1
      candidates:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      changed:
        type: array
        default: []
        items:
          type: string
          minLength: 1
      controls:
        type: array
        default: []
        items:
          type: string
          minLength: 1
      decision:
        type: string
        minLength: 1
      analysis:
        type: object
        additionalProperties: false
        properties:
          method:
            enum:
              - descriptive
              - exploratory
              - bootstrap
              - permutation
              - t_test
              - mann_whitney_u
              - wilcoxon
              - anova
          tail:
            enum:
              - one_tailed
              - two_tailed
          alpha:
            type: number
            exclusiveMinimum: 0
            exclusiveMaximum: 1
          confidence:
            type: number
            exclusiveMinimum: 0
            exclusiveMaximum: 1
          effect:
            oneOf:
              - type: string
                minLength: 1
              - type: object
                additionalProperties:
                  oneOf:
                    - type: string
                      minLength: 1
                    - type: number
          assumptions:
            type: array
            default: []
            items:
              type: string
              minLength: 1
          multiple_comparisons:
            oneOf:
              - type: boolean
              - enum:
                  - bonferroni
                  - false_discovery_rate
                  - none
          note:
            type: string

  report:
    type: object
    additionalProperties: false
    properties:
      formats:
        type: array
        minItems: 1
        uniqueItems: true
        default:
          - markdown
          - toon
        items:
          enum:
            - markdown
            - toon
            - charts
      limits:
        type: string
        minLength: 1
