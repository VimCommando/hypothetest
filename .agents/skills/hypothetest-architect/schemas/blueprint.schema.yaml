$schema: https://json-schema.org/draft/2020-12/schema
$id: https://hypothetest.elastic/schemas/blueprint.schema.yaml
title: Hypothetest Blueprint Manifest
type: object
additionalProperties: false
required:
  - name
  - hypothesis
  - plan
  - readme
properties:
  name:
    type: string
    minLength: 1
    pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
  owner:
    type: string
    minLength: 1
  description:
    type: string
  version:
    type: string
  hypothesis:
    $ref: "#/$defs/path"
  plan:
    $ref: "#/$defs/path"
  readme:
    $ref: "#/$defs/path"
  expected_runtime:
    type: string
  prerequisites:
    type: array
    default: []
    items:
      type: string
      minLength: 1
  self_contained:
    type: boolean
    default: false
  include:
    type: object
    additionalProperties: false
    properties:
      directories:
        type: array
        default: []
        items:
          $ref: "#/$defs/path"
      files:
        type: array
        default: []
        items:
          $ref: "#/$defs/file"
  datasets:
    type: array
    default: []
    items:
      $ref: "#/$defs/dataset"
  checksums:
    type: string
    default: checksums.yml
  archive:
    type: object
    additionalProperties: false
    properties:
      format:
        const: zip
        default: zip
      include_evaluations:
        type: boolean
        default: false
      exclude:
        type: array
        default: []
        items:
          type: string

$defs:
  path:
    type: string
    minLength: 1

  file:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        $ref: "#/$defs/path"
      kind:
        enum:
          - data
          - track
          - template
          - payload
          - script
          - diagnostics
          - generated
          - evaluation_artifact
      format:
        enum:
          - ndjson
          - jsonl
          - csv
          - tsv
          - json
          - yaml
          - yml
          - toon
          - zip
          - sh
          - py
          - gz
      required:
        type: boolean
        default: true
      checksum:
        type: string
      description:
        type: string

  dataset:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
      path:
        type: string
      generated_by:
        type: object
        additionalProperties: true
        properties:
          tool:
            enum:
              - rally
              - espipe
              - shell
              - python
          command:
            type: string
          script:
            type: string
          params:
            type: object
            additionalProperties: true
      format:
        enum:
          - ndjson
          - jsonl
          - csv
          - tsv
          - ndjson.gz
          - jsonl.gz
          - csv.gz
          - tsv.gz
          - json
          - yaml
      target:
        type: string
      size:
        type: string
      documents:
        type: integer
        minimum: 0
      checksum:
        type: string
      required:
        type: boolean
        default: true
      description:
        type: string
