name: index-mode-storage
owner: storage
question: >
  How much does each index mode and codec/sorting combination reduce on-disk
  index store size compared with the standard default, and what is the
  indexing throughput cost of each variation, when loading the Yelp review
  dataset?
hypothesis:
  claim: >
    At least one candidate will reduce store size by more than 10% without
    more than 20% indexing throughput degradation.
  "null": no variation achieves more than 10% smaller store size than standard after force-merge
  alternative: at least one variation achieves more than 10% smaller store size than standard after force-merge
  tail: one_tailed

experiment:
  intent: compare_data_configuration
  constants:
    required:
      - elasticsearch_version
      - heap_size
      - dataset
      - document_count
      - shard_count
      - replica_count
      - bulk_batch_size
    best_effort:
      - remote_host_load
  variables:
    - index_mode
    - codec
    - index_sorting

deployment:
  target: compose
  scope: remote
  engine: podman
  elasticsearch:
    version: 9.3.3
    security: false
    heap: 2g
    memory: 4g
  services:
    kibana: false
  remote:
    host: ironhide.local
    user: benchmark
    auth:
      method: ssh_certificate
      ssh_config_host: ironhide.local
    workdir: /tmp/hypothetest/evaluations

dataset:
  loader: espipe
  input: datasets/yelp/yelp_academic_dataset_review.json
  target: per-variation
  locality: operator-local
  options:
    batch_size: 5000
  fixture:
    description: >
      Yelp Academic Dataset review corpus. Must be present at the declared
      path on the operator machine before execution. The loader runs locally
      and pushes documents to the remote Elasticsearch endpoint. Coordinator
      must verify file existence and readability before the Operator executes.

variations:
  standard:
    description: Default index mode, LZ4 codec, no index sorting.
    config:
      load:
        template: templates/base-template.yml
        template_name: yelp-reviews-standard

  logsdb:
    description: >
      logsdb index mode, LZ4 codec, stored _source (basic license). Uses the
      yelp-reviews-logsdb index template and the yelp-reviews-date-to-timestamp
      ingest pipeline to rename the corpus `date` field to `@timestamp`
      as required by logsdb.
    config:
      load:
        template: templates/logsdb-template.yml
        template_name: yelp-reviews-logsdb
        pipeline: templates/pipeline-date-to-timestamp.yml
        pipeline_name: yelp-reviews-date-to-timestamp

  logsdb_synthetic_source:
    description: >
      logsdb index mode with synthetic _source explicitly enabled, LZ4 codec.
      Requires an enterprise or trial license. Synthetic _source reconstructs
      the document source from doc values at read time, eliminating the stored
      _source entirely and yielding the maximum storage reduction for logsdb.
    config:
      load:
        template: templates/logsdb-synthetic-source-template.yml
        template_name: yelp-reviews-logsdb-synthetic-source
        pipeline: templates/pipeline-date-to-timestamp.yml
        pipeline_name: yelp-reviews-date-to-timestamp
    prerequisites:
      - enterprise_or_trial_license

  standard_best_compression:
    description: Standard index mode with ZSTD (best_compression) codec.
    config:
      load:
        template: templates/standard-best-compression-template.yml
        template_name: yelp-reviews-standard-best-compression

  standard_best_compression_sorted:
    description: >
      Standard index mode with ZSTD codec and index sorting by business_id
      ascending. Sorting by a high-cardinality keyword field improves
      compression locality by co-locating documents with the same business.
    config:
      load:
        template: templates/standard-best-compression-sorted-template.yml
        template_name: yelp-reviews-standard-best-compression-sorted

evaluation:
  repeats: 3
  order: randomized
  reset:
    - delete_indices
    - clear_caches
    - reload_dataset
    - verify_cluster_green
  phases:
    - name: load_data
      tool: espipe
      with:
        input: datasets/yelp/yelp_academic_dataset_review.json
        target: http://ironhide.local:9200/{variation_index}
        batch_size: 5000

    - name: collect_store_after_load
      tool: elasticsearch_api
      with:
        request:
          method: GET
          path: /{variation_index}/_stats/store,segments
        artifact: store_after_load.json

    - name: force_merge
      tool: elasticsearch_api
      with:
        request:
          method: POST
          path: /{variation_index}/_forcemerge?max_num_segments=1&wait_for_completion=true
        artifact: force_merge_result.json

    - name: collect_store_after_force_merge
      tool: elasticsearch_api
      with:
        request:
          method: GET
          path: /{variation_index}/_stats/store,segments
        artifact: store_after_force_merge.json

measure:
  primary:
    - name: store_size_after_force_merge
      unit: bytes
      source: elasticsearch_api
      api: /{variation_index}/_stats/store
      field: _all.total.store.size_in_bytes
      phase: collect_store_after_force_merge

    - name: indexing_throughput_docs_per_sec
      unit: docs/sec
      source: espipe
      field: docs_per_second
      phase: load_data

  secondary:
    - name: store_size_after_load
      unit: bytes
      source: elasticsearch_api
      api: /{variation_index}/_stats/store
      field: _all.total.store.size_in_bytes
      phase: collect_store_after_load

    - name: segment_count_after_load
      unit: count
      source: elasticsearch_api
      api: /{variation_index}/_stats/segments
      field: _all.total.segments.count
      phase: collect_store_after_load

    - name: segment_count_after_force_merge
      unit: count
      source: elasticsearch_api
      api: /{variation_index}/_stats/segments
      field: _all.total.segments.count
      phase: collect_store_after_force_merge

    - name: force_merge_duration_sec
      unit: seconds
      source: phase_artifact
      artifact: force_merge_result.json
      field: took
      phase: force_merge

  diagnostics:
    tool: esdiag
    at:
      before_load:
        required_apis:
          - _cluster/health
          - _nodes/stats
          - _cat/nodes?v&format=json

      after_load:
        required_apis:
          - _nodes/stats
          - _stats
          - _cat/segments?format=json
          - _cat/indices?v&format=json

      after_force_merge:
        required_apis:
          - _nodes/stats
          - _stats
          - _cat/segments?format=json
          - _cat/indices?v&format=json

compare:
  baseline: standard
  candidates:
    - logsdb
    - logsdb_synthetic_source
    - standard_best_compression
    - standard_best_compression_sorted
  changed:
    - index_mode
    - codec
    - index_sorting
  controls:
    - elasticsearch_version
    - heap_size
    - dataset
    - document_count
    - shard_count
    - replica_count
    - bulk_batch_size
  analysis:
    method: bootstrap
    tail: one_tailed
    alpha: 0.05
    confidence: 0.95
    effect:
      store_size_after_force_merge: 10%
      indexing_throughput_docs_per_sec: 20%
    assumptions:
      - variation resets make repeated measurements sufficiently independent
      - store size measurements are deterministic for the same dataset and settings
      - indexing throughput may vary due to remote host load; three repeats are exploratory
    multiple_comparisons: bonferroni
    note: >
      Bonferroni correction applies to store_size comparisons. Throughput
      comparisons are secondary and exploratory.
  decision: >
    Accept the alternative hypothesis for a candidate if its
    store_size_after_force_merge is more than 10% smaller than the standard
    baseline and its indexing_throughput_docs_per_sec is no more than 20%
    lower than the standard baseline.

report:
  formats:
    - markdown
    - toon
    - charts
  limits: >
    Results apply only to bulk-load of the Yelp review corpus via espipe on
    a single-shard, no-replica index executing in Podman on a remote host.
    Elasticsearch version 9.3.3. Development-grade results only.
    index.sort.field requires business_id keyword field in documents; verify
    before evaluating standard_best_compression_sorted. logsdb synthetic _source
    may not be suitable if consumers rely on stored source fields not
    reconstructable from doc values.
