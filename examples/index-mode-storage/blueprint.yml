name: index-mode-storage
owner: storage
hypothesis: hypothesis.md
plan: hypothetest.yml
readme: README.md
self_contained: false
expected_runtime: 60m
prerequisites:
  - podman
  - espipe >= 0.3.0
  - esdiag
  - ssh certificate access to remote host (ironhide.local via ~/.ssh/config)
include:
  directories:
    - templates/
    - diagnostics/
    - generated/
datasets:
  - name: yelp-reviews
    path: datasets/yelp/yelp_academic_dataset_review.json
    format: jsonl
    target: per-variation
    description: >
      Yelp Academic Dataset review corpus (NDJSON). Must be present on the
      operator machine at datasets/yelp/yelp_academic_dataset_review.json
      relative to the blueprint root before execution. The loader runs locally
      and pushes documents to the remote Elasticsearch endpoint. Not included
      in this blueprint.
archive:
  format: zip
  include_evaluations: false
