# Metrics Plan — index-mode-storage
# Generated by hypothetest-architect from hypothetest.yml
# All metric sources must be verified by the Operator before execution.

primary_metrics:

  - name: store_size_after_force_merge
    description: >
      Total on-disk store size of the benchmark index after force-merge to
      1 segment. This is the primary storage comparison metric.
    unit: bytes
    source: elasticsearch_api
    collection_point: after_force_merge
    api: GET /{variation_index}/_stats/store,segments
    extraction_path: _all.total.store.size_in_bytes
    phase: collect_store_after_force_merge
    artifact: store_after_force_merge.json
    esdiag_bundle: after_force_merge
    status: resolved

  - name: indexing_throughput_docs_per_sec
    description: >
      Documents indexed per second during the espipe bulk load phase.
      The runner captures espipe's raw stdout to espipe_output.json.
      The format of this file depends on espipe's output mode — it may
      be structured JSON or human-readable text. The Analyst is
      responsible for parsing and normalizing the throughput value.
    unit: docs/sec
    source: espipe
    collection_point: load_data phase output
    extraction_path: docs_per_second
    phase: load_data
    artifact: espipe_output.json
    status: raw_capture
    note: >
      The runner captures espipe stdout verbatim. If espipe emits JSON
      with a docs_per_second field, extraction is direct. If espipe
      emits human-readable output, the Analyst must parse the throughput
      value from the raw capture. Confirm espipe output format before
      relying on extraction_path.

secondary_metrics:

  - name: store_size_after_load
    description: >
      Total on-disk store size immediately after bulk load, before force-merge.
      Useful for understanding pre-merge storage overhead.
    unit: bytes
    source: elasticsearch_api
    collection_point: after_load
    api: GET /{variation_index}/_stats/store,segments
    extraction_path: _all.total.store.size_in_bytes
    phase: collect_store_after_load
    artifact: store_after_load.json
    esdiag_bundle: after_load
    status: resolved

  - name: segment_count_after_load
    description: Number of Lucene segments immediately after bulk load.
    unit: count
    source: elasticsearch_api
    collection_point: after_load
    api: GET /{variation_index}/_stats/segments
    extraction_path: _all.total.segments.count
    phase: collect_store_after_load
    artifact: store_after_load.json
    esdiag_bundle: after_load
    status: resolved

  - name: segment_count_after_force_merge
    description: >
      Number of Lucene segments after force-merge. Should be 1 if
      force-merge completed successfully.
    unit: count
    source: elasticsearch_api
    collection_point: after_force_merge
    api: GET /{variation_index}/_stats/segments
    extraction_path: _all.total.segments.count
    phase: collect_store_after_force_merge
    artifact: store_after_force_merge.json
    esdiag_bundle: after_force_merge
    status: resolved

  - name: force_merge_duration_sec
    description: >
      Wall-clock time for the force-merge operation to complete.
      Extracted from the _forcemerge API response `took` field (milliseconds).
    unit: seconds
    source: phase_artifact
    artifact: force_merge_result.json
    extraction_path: took
    phase: force_merge
    status: resolved
    note: >
      The _forcemerge API returns `took` in milliseconds when
      wait_for_completion=true. Convert to seconds in the report.

diagnostic_collections:

  before_load:
    trigger: before load_data phase
    required_apis:
      - cluster_health
      - nodes_stats
      - cat_nodes
    purpose: >
      Baseline cluster state before any indexing. Captures node resource
      state and confirms cluster is green before each variation evaluation.

  after_load:
    trigger: after load_data phase, before force_merge phase
    required_apis:
      - nodes_stats
      - indices_stats
      - cat_segments
      - cat_indices
    purpose: >
      Post-load cluster state. Captures indexing stats, segment counts,
      and store sizes before force-merge. Used to derive store_size_after_load
      and segment_count_after_load as a cross-check against phase artifacts.

  after_force_merge:
    trigger: after collect_store_after_force_merge phase
    required_apis:
      - nodes_stats
      - indices_stats
      - cat_segments
      - cat_indices
    purpose: >
      Post-force-merge cluster state. Primary source for store_size_after_force_merge
      cross-check. Captures final segment layout and store sizes.

unresolved_metrics: []

notes:
  - >
    espipe structured output format must be confirmed before execution.
    If espipe does not emit JSON, indexing_throughput_docs_per_sec must
    be parsed from stdout and recorded manually or via a shell wrapper.
  - >
    The standard_best_compression_sorted variation sorts by business_id
    (keyword, ascending). This field is present natively in the Yelp Academic
    Dataset review corpus. If the corpus is replaced, verify field presence
    before execution. @timestamp is NOT required for this variation.
  - >
    All store size values from _stats include both primary and replica shards.
    This benchmark uses 0 replicas, so _all.total.store.size_in_bytes reflects
    primary shard storage only.
