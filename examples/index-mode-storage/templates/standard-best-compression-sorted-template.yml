# Index template — standard index mode with best_compression (ZSTD) codec
# and index sorting by business_id ascending.
# Used by the standard_best_compression_sorted variation.
#
# Loaded by espipe at load time via:
#   --template templates/standard-best-compression-sorted-template.yml
#   --template-name yelp-reviews-standard-best-compression-sorted

name: yelp-reviews-standard-best-compression-sorted
index_patterns:
  - yelp-reviews-standard-best-compression-sorted
priority: 200
template:
  settings:
    number_of_shards: 1
    number_of_replicas: 0
    index.codec: best_compression
    index.sort.field: business_id
    index.sort.order: asc
  mappings:
    dynamic: false
    properties:
      review_id:
        type: keyword
      user_id:
        type: keyword
      business_id:
        type: keyword
      stars:
        type: float
      useful:
        type: integer
      funny:
        type: integer
      cool:
        type: integer
      text:
        type: text
      date:
        type: date
        format: "yyyy-MM-dd HH:mm:ss"
