name: eck-generic-ingest
owner: infrastructure
question: >
  Does increasing the JVM heap from 2g to 4g on a single-node Kubernetes
  Elasticsearch cluster improve bulk ingest throughput for a generic
  document corpus?
hypothesis:
  claim: >
    Increasing heap from 2g to 4g will improve indexing throughput by at
    least 10% on a single-node ECK-managed cluster.
  "null": larger heap does not improve indexing throughput by at least 10%
  alternative: larger heap improves indexing throughput by at least 10%
  tail: one_tailed

experiment:
  intent: compare_cluster_configuration
  constants:
    required:
      - elasticsearch_version
      - node_count
      - dataset
      - bulk_batch_size
      - shard_count
      - replica_count
      - storage_size
    best_effort:
      - kubernetes_node_resources
  variables:
    - jvm_heap_size

deployment:
  target: kubernetes
  namespace: hypothetest
  elasticsearch:
    version: 9.0.0
    nodes: 1
    storage: 10Gi
    security: false
    heap: 2g
    memory: 4g
  services:
    kibana: false
  kubernetes:
    operator_version: 3.3.2
    install_operator: true
    license:
      type: enterprise_trial
      accept_eula: true

dataset:
  loader: espipe
  input: ./data/docs.ndjson
  target: benchmark-index
  options:
    batch_size: 5000

variations:
  default-heap:
    description: >
      Baseline configuration using the Architect default: 2g JVM heap,
      4g container memory.
    config:
      elasticsearch:
        heap: 2g
        memory: 4g

  larger-heap:
    description: >
      Candidate configuration with doubled JVM heap: 4g JVM heap,
      8g container memory.
    config:
      elasticsearch:
        heap: 4g
        memory: 8g

evaluation:
  repeats: 3
  order: randomized
  reset:
    - delete_indices
    - clear_caches
    - reload_dataset
    - verify_cluster_green
  phases:
    - name: load_data
      tool: espipe
      with:
        input: ./data/docs.ndjson
        target: benchmark-index
        batch_size: 5000

    - name: collect_stats_after_load
      tool: elasticsearch_api
      with:
        request:
          method: GET
          path: /benchmark-index/_stats/store,indexing,segments
        artifact: stats_after_load.json

measure:
  primary:
    - name: indexing_throughput_docs_per_sec
      unit: docs/sec
      source: espipe
      field: docs_per_second
      phase: load_data

    - name: store_size_after_load
      unit: bytes
      source: elasticsearch_api
      api: /benchmark-index/_stats/store
      field: _all.total.store.size_in_bytes
      phase: collect_stats_after_load

  secondary:
    - name: segment_count_after_load
      unit: count
      source: elasticsearch_api
      api: /benchmark-index/_stats/segments
      field: _all.total.segments.count
      phase: collect_stats_after_load

    - name: indexing_time_millis
      unit: ms
      source: elasticsearch_api
      api: /benchmark-index/_stats/indexing
      field: _all.total.indexing.index_time_in_millis
      phase: collect_stats_after_load

  diagnostics:
    tool: esdiag
    at:
      before_load:
        apis:
          - _cluster/health
          - _nodes/stats
          - _cat/nodes?v&format=json

      after_load:
        apis:
          - _nodes/stats
          - _stats
          - _cat/segments?format=json
          - _cat/indices?v&format=json

compare:
  baseline: default-heap
  candidates:
    - larger-heap
  changed:
    - jvm_heap_size
  controls:
    - elasticsearch_version
    - node_count
    - dataset
    - bulk_batch_size
    - shard_count
    - replica_count
    - storage_size
  analysis:
    method: bootstrap
    tail: one_tailed
    alpha: 0.05
    confidence: 0.95
    effect:
      indexing_throughput_docs_per_sec: 10%
    assumptions:
      - variation resets make repeated measurements sufficiently independent
      - indexing throughput may vary due to Kubernetes scheduling and node resource contention
      - three repeats are exploratory
    multiple_comparisons: false
  decision: >
    Accept the alternative hypothesis if larger-heap indexing throughput
    is more than 10% higher than default-heap across repeats.

report:
  formats:
    - markdown
    - toon
    - charts
  limits: >
    Results apply only to bulk-load via espipe on a single-node ECK-managed
    Elasticsearch 9.0.0 cluster. Development-grade: k3s or lightweight
    Kubernetes, node.store.allow_mmap disabled, no vm.max_map_count tuning.
    Heap increase also requires doubling container memory limits; the
    comparison conflates heap headroom with total available memory.
    Conclusions should not be used for production capacity planning without
    re-evaluating on representative infrastructure.
