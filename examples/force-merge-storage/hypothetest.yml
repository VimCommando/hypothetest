apiVersion: hypothetest.elastic/v1
kind: BenchmarkScenario
metadata:
  name: force-merge-storage-comparison
  owner: storage
spec:
  question: How long does force merge take on the same data with different storage settings?
  deployment:
    target: compose
    engine: auto
    elasticsearch:
      version: 8.18.0
      security: false
      heap: 2g
      memory: 4g
  dataset:
    loader: espipe
    input: ./data/logs.ndjson
    target: logs-benchmark-default
    default_settings:
      number_of_shards: 1
      number_of_replicas: 0
  setup: []
  variations:
    named_volume:
      compose:
        storage:
          type: named_volume
    bind_mount:
      compose:
        storage:
          type: bind_mount
          path: ./var/esdata
  benchmark:
    repeats: 3
    randomize_variation_order: true
    phases:
      - name: force_merge
        runner: elasticsearch_api
        config:
          method: POST
          path: /logs-benchmark-default/_forcemerge?max_num_segments=1&wait_for_completion=true
  isolation:
    mode: reset_between_variations
    reset:
      - delete_indices
      - delete_volumes
      - reload_dataset
  metrics:
    primary:
      - force_merge_duration
      - disk_write_bytes
      - cpu_percent
      - merge_time
      - resulting_segment_count
      - resulting_store_size
    secondary:
      - heap_used_percent
      - gc_time
      - disk_read_bytes
  diagnostics:
    collector: esdiag
    collections:
      before_phase:
        apis:
          - _cluster/health
          - _nodes/stats
      after_phase:
        apis:
          - _nodes/stats
          - _stats
          - _cat/segments?format=json
  comparison:
    hypothesis:
      "null": bind_mount force_merge_duration and disk_write_bytes are not materially different from named_volume
      alternative: bind_mount force_merge_duration or disk_write_bytes differ materially from named_volume
      tail: two_tailed
    baseline: named_volume
    candidates:
      - bind_mount
    independent:
      - compose_storage_mode
    dependent:
      - force_merge_duration
      - disk_write_bytes
      - cpu_percent
      - merge_time
      - resulting_segment_count
      - resulting_store_size
    controlled:
      - elasticsearch_version
      - heap_size
      - dataset
      - index_settings
      - compose_engine
    dimensions:
      - variation
      - repeat
    statistical_plan:
      test: bootstrap
      tail: two_tailed
      significance_level: 0.05
      confidence_level: 0.95
      minimum_effect_size:
        force_merge_duration: 10%
        disk_write_bytes: 10%
      assumptions:
        - delete_volumes and reload_dataset reset storage state between variations
        - force merge timings may be non-normal
      multiple_comparison_correction: false
    decision_rule: Accept the hypothesis if bind_mount differs from named_volume in force_merge_duration or disk_write_bytes by at least 10% across repeats.
  report:
    formats:
      - markdown
      - toon
      - charts
    interpretation: If bind mounts differ materially from named volumes, storage mode should be treated as a controlled variable in local force-merge benchmarks. If the difference is below the decision threshold, either storage mode is acceptable for this workload. Conclusions are limited to local compose, the selected compose engine, Elasticsearch 8.18.0, and this dataset.
